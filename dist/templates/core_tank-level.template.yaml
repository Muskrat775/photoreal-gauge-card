schema: 1
kind: template
id: core_tank-level
pack: core
name: Tank level
description: 0-100 % tank level, red when nearly empty.
tags:
- water
- tank
- level
requires:
  card: '>=1.7.0'
inputs:
- key: entity
  label: Level sensor
  required: true
  domain:
  - sensor
suggest:
  unit:
  - '%'
  domain:
  - sensor
config:
  min: 0
  max: 100
  decimals: 0
  start_angle: -135
  end_angle: 135
  major_ticks: 11
  minor_ticks: 4
  thresholds:
  - from: 0
    to: 15
    color: '#e53935'
  - from: 15
    to: 30
    color: '#fdd835'
  - from: 30
    to: 100
    color: '#29b6f6'
  labels:
  - text: '{name}'
    x: 50
    y: 62
    size: 5
  digitals:
  - x: 50
    y: 76
    width: 30
    font_size: 6.5
  unit: '%'
  name: Tank
