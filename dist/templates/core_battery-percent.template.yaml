schema: 1
kind: template
id: core_battery-percent
pack: core
name: Battery percent
description: 0-100 % with red, yellow and green zones and an optional charging LED.
tags:
- battery
- percent
requires:
  card: '>=1.7.0'
inputs:
- key: entity
  label: Battery level
  required: true
  domain:
  - sensor
  device_class: battery
- key: charging
  label: Charging sensor (optional)
  required: false
  domain:
  - binary_sensor
suggest:
  device_class:
  - battery
  unit:
  - '%'
  domain:
  - sensor
config:
  min: 0
  max: 100
  decimals: 0
  start_angle: -135
  end_angle: 135
  major_ticks: 11
  minor_ticks: 4
  thresholds:
  - from: 0
    to: 20
    color: '#e53935'
  - from: 20
    to: 50
    color: '#fdd835'
  - from: 50
    to: 100
    color: '#43a047'
  labels:
  - text: '{name}'
    x: 50
    y: 62
    size: 5
  digitals:
  - x: 50
    y: 76
    width: 30
    font_size: 6.5
  unit: '%'
  name: Battery
  leds:
  - x: 50
    y: 88
    size: 3
    label: Charging
    default_color: '#3a0a10'
    conditions:
    - use_gauge_entity: false
      entity: $input:charging
      operator: equals
      value: 'on'
      color: '#43a047'
      behavior: blink
